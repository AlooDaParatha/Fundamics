<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundemics Admin Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --navy: #0a0f1e;
            --navy-mid: #111827;
            --navy-light: #1e293b;
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --gold-glow: rgba(201, 168, 76, 0.18);
            --text-muted: #8899a6;
            --white: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--navy);
            overflow: hidden;
        }

        /* Ambient background orbs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.12), transparent 70%);
            top: -100px;
            left: -100px;
            animation: drift1 12s ease-in-out infinite alternate;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(201, 168, 76, 0.09), transparent 70%);
            bottom: -80px;
            right: -80px;
            animation: drift2 14s ease-in-out infinite alternate;
        }

        @keyframes drift1 {
            to {
                transform: translate(60px, 60px);
            }
        }

        @keyframes drift2 {
            to {
                transform: translate(-50px, -40px);
            }
        }

        /* Grid texture overlay */
        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        .login-wrap {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Brand mark above card */
        .brand-mark {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--navy);
            font-family: 'Playfair Display', serif;
            box-shadow: 0 0 24px var(--gold-glow);
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 0.02em;
        }

        .login-card {
            background: linear-gradient(160deg, #151d2e, #0e1525);
            padding: 44px 40px;
            width: 400px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow:
                0 40px 80px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(201, 168, 76, 0.08) inset,
                0 1px 0 rgba(255, 255, 255, 0.06) inset;
            text-align: center;
        }

        .login-card h2 {
            margin: 0 0 6px;
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 0.01em;
        }

        .login-card>p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 32px;
            font-weight: 300;
            letter-spacing: 0.03em;
        }

        /* Divider line */
        .divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            border-radius: 2px;
            margin: 0 auto 28px;
        }

        .field {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 7px;
        }

        .field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #4a5568;
            font-size: 15px;
            pointer-events: none;
        }

        .login-card input {
            width: 100%;
            padding: 13px 14px 13px 40px;
            margin: 0;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            background: rgba(255, 255, 255, 0.04);
            color: var(--white);
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }

        .login-card input::placeholder {
            color: #3d4f63;
        }

        .login-card input:focus {
            border-color: var(--gold);
            background: rgba(201, 168, 76, 0.05);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.12);
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-top: 8px;
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
            position: relative;
            overflow: hidden;
        }

        .login-card button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent);
            pointer-events: none;
        }

        .login-card button:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transform: translateY(-1px);
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.45);
        }

        .login-card button:active {
            transform: translateY(0);
        }

        #status {
            margin-top: 16px;
            font-size: 13px;
            min-height: 20px;
            font-weight: 400;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 11px;
            color: #2d3d52;
            letter-spacing: 0.04em;
        }

        .footer-note span {
            color: #3d5066;
        }
    </style>
</head>

<body>
    <div class="grid-bg"></div>

    <div class="login-wrap">
        <div class="brand-mark">
            <div class="brand-icon">F</div>
            <div class="brand-name">Fundemics</div>
        </div>

        <div class="login-card">
            <h2>Admin Portal</h2>
            <div class="divider"></div>
            <p>Secure access — authorized personnel only</p>

            <div class="field">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="admin@fundemics.com">
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••••">
            </div>

            <button id="loginBtn">Sign In</button>

            <p id="status"></p>

            <p class="footer-note">Protected by <span>Firebase Authentication</span></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword }
            from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCtOF7VYHVBraOnml8VksUo_1vPp5fKdlU",
            authDomain: "fundemicstutorialss.firebaseapp.com",
            projectId: "fundemicstutorialss",
            appId: "1:1017511766005:web:3cfb38921e7585b00aa22bc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("loginBtn").addEventListener("click", async () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const status = document.getElementById("status");

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "dashboard.html";
            }
            catch (error) {
                status.style.color = "#f87171";
                status.innerText = "Invalid Email or Password";
            }
        });
    </script>
</body>

</html>
